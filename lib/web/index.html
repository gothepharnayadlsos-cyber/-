<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>二创工坊</title>
  <link rel="stylesheet" href="/fanwork/assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4f7cff" />
            <stop offset="1" stop-color="#7b4ff2" />
          </linearGradient>
        </defs>
        <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#lg)" />
        <path d="M20 22h24M20 32h24M20 42h14" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".92" />
        <circle cx="46" cy="42" r="7" fill="#fff" opacity=".95" />
      </svg>
      <div>
        <h1>二创工坊</h1>
        <p class="sub">先体检，再生成 · 每一稿都带风险报告</p>
      </div>
    </div>
    <div class="topbar-right">
      <span class="badge" id="model-badge">连接中…</span>
      <button class="ghost" id="btn-new" hidden>新建项目</button>
    </div>
  </header>

  <nav class="steps" id="steps" hidden>
    <div class="step" data-step="input"><b>1</b><span>输入</span></div>
    <div class="step" data-step="risk"><b>2</b><span>体检与修复</span></div>
    <div class="step" data-step="draft"><b>3</b><span>生成与审核</span></div>
    <div class="step" data-step="final"><b>4</b><span>定稿</span></div>
  </nav>

  <main id="app">
    <section class="empty">
      <p>正在加载工作台…</p>
    </section>
  </main>

  <footer class="footer">
    <span>dsh-fanwork 0.1.0 · 数据保存在本机</span>
    <span id="data-dir"></span>
  </footer>

  <script src="/fanwork/assets/app.js" type="module"></script>
</body>
</html>
